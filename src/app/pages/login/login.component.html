<div class="login-form-wrapper">
  <form class="login-form" (ngSubmit)="onLogin()" #loginForm="ngForm">
    <div class="login-header">
      <div class="login-badge">R</div>
      <h2 class="login-title">Đăng nhập hệ thống</h2>
      <p class="login-subtitle">
        Vui lòng nhập thông tin tài khoản để tiếp tục sử dụng hệ thống
      </p>
    </div>

    <div class="form-group">
      <label for="username" class="form-label">Tên đăng nhập</label>
      <div class="input-wrapper">
        <input id="username"
               name="username"
               type="text"
               class="form-control"
               required
               [(ngModel)]="username"
               placeholder="Nhập tên đăng nhập" />
      </div>
    </div>

    <div class="form-group">
      <label for="password" class="form-label">Mật khẩu</label>
      <div class="input-wrapper">
        <input id="password"
               name="password"
               type="password"
               class="form-control"
               required
               [(ngModel)]="password"
               placeholder="Nhập mật khẩu" />
      </div>
    </div>

    <div class="form-options">
      <label class="remember-me">
        <input type="checkbox"
               name="remember"
               [(ngModel)]="rememberMe" />
        <span>Ghi nhớ đăng nhập</span>
      </label>

      <a class="forgot-password" href="#" (click)="onForgotPassword($event)">
        Quên mật khẩu?
      </a>
    </div>

    <button type="submit" class="login-btn" [disabled]="loginForm.invalid">
      Đăng nhập
    </button>

    <div class="divider-container">
      <span class="divider-line"></span>
      <span class="divider-text">Hoặc đăng nhập với</span>
      <span class="divider-line"></span>
    </div>

    <div class="google-signin-container">
      <div id="google-signin-button"></div>

      <div *ngIf="isGoogleLoading" class="google-loading">
        Đang xử lý đăng nhập Google...
      </div>

      <div *ngIf="googleError" class="google-error">
        {{ googleError }}
      </div>
    </div>
  </form>
</div>
