<div class="create-user">
  <form nz-form [formGroup]="editRoomRentalForm" (ngSubmit)="onSubmit()">

    <input type="hidden" formControlName="id" />
    <input type="hidden" formControlName="createdDate" />
    <input type="hidden" formControlName="updatedDate" />
    <input type="hidden" formControlName="creatorUser" />
    <input type="hidden" formControlName="lastUpdateUser" />

    <div *ngFor="let control of controlRequestArray">
      <nz-form-item>
        <nz-form-label [nzFor]="control.key">{{ control.label }}</nz-form-label>
        <nz-form-control>

          <input *ngIf="control.type === 'text' || control.type === 'number'"
                 nz-input
                 [formControlName]="control.key"
                 [id]="control.key"
                 [placeholder]="control.placeholder || ''"
                 [type]="control.type === 'number' ? 'number' : 'text'" />

          <nz-select *ngIf="control.type === 'select'"
                     [formControlName]="control.key"
                     [nzPlaceHolder]="control.placeholder || 'Chọn...'"
                     nzAllowClear>
            <nz-option *ngFor="let option of control.options ? control.options() : []"
                       [nzValue]="option.value"
                       [nzLabel]="option.text || ''">
            </nz-option>
          </nz-select>

          <nz-upload *ngIf="control.type === 'file'"
                     nzListType="picture-card"
                     [nzBeforeUpload]="beforeUpload"
                     [nzFileList]="fileList"
                     [nzShowButton]="fileList.length < 8"
                     [nzPreview]="handlePreview">
            <div>
              <nz-icon nzType="plus"></nz-icon>
              <div style="margin-top: 8px">Upload</div>
            </div>
          </nz-upload>

          <nz-modal *ngIf="control.type === 'file'"
                    [nzVisible]="previewVisible"
                    [nzContent]="modalContent"
                    [nzFooter]="null"
                    (nzOnCancel)="previewVisible = false">
            <ng-template #modalContent>
              <img [src]="previewImage" style="width: 100%" />
            </ng-template>
          </nz-modal>

        </nz-form-control>
      </nz-form-item>
    </div>

    <nz-form-item>
      <nz-form-control>
        <div style="display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px;">
          <button nz-button type="button" (click)="closeModal()">Hủy</button>
          <button nz-button nzType="primary" htmlType="submit">Lưu</button>
        </div>
      </nz-form-control>
    </nz-form-item>

  </form>
</div>
